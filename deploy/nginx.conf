# /etc/nginx/sites-available/committee-attendance
# 有効化: sudo ln -s /etc/nginx/sites-available/committee-attendance /etc/nginx/sites-enabled/
#
# server_name はドメインを取得している場合はドメイン名に、IPアクセスのみの場合はVPSのグローバルIPに変更してください。

server {
    listen 80;
    listen [::]:80;
    server_name example.com;  # ドメイン名 or サーバーIPに変更

    # CSVインポート機能で複数ファイルをアップロードするため、上限を少し広めに確保
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

